[workspace]
members = [
  "crates/loam-math",
  "crates/loam-shape",
  "crates/loam-scene",
  "crates/loam-time",
  "crates/loam-shader",
  "crates/loam-render",
  "crates/loam-asset",
  "crates/loam-input",
  "crates/loam-camera",
  "crates/loam-player",
  "crates/loam-physics",
  "crates/loam-app",
  "crates/loam-text",
  "crates/loam-console",
  "crates/loam-egui",
  "crates/hero",
  "crates/polytope_playground",
  "crates/tesseract_demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
# Tracks the `channel` pin in rust-toolchain.toml; bump both together.
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
version = "0.1.0"
authors = ["Zach Humes <humesze@proton.me>"]
repository = "https://github.com/throgsoft/loam"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"

wgpu  = { version = "27", features = ["wgsl"] }
winit = "0.30"
naga = { version = "27", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
notify = "6"
pollster = "0.3"

# `web-time` is a drop-in for `std::time::Instant` / `Duration`: on native it re-exports
# the std types verbatim; on wasm32 it backs `Instant` with `performance.now()`. Used in
# place of `std::time::Instant` anywhere the runtime needs wall-clock-ish timing (event
# loop, FixedTimestep, FPS bookkeeping). Calling `std::time::Instant::now` on wasm32
# panics, so the swap is mandatory for the browser runtime.
web-time = "1"

[package]
name = "loam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A Rust game engine where the geometry of the world is a parameter the game picks"
keywords = ["gamedev", "geometry", "non-euclidean", "4d", "wgpu"]
categories = ["game-engines", "graphics", "mathematics"]

[dependencies]
loam-math      = { path = "crates/loam-math",    version = "0.1.0" }
loam-scene     = { path = "crates/loam-scene",   version = "0.1.0" }
loam-shape     = { path = "crates/loam-shape",   version = "0.1.0" }
loam-time      = { path = "crates/loam-time",    version = "0.1.0" }
loam-shader    = { path = "crates/loam-shader",  version = "0.1.0" }
loam-render    = { path = "crates/loam-render",  version = "0.1.0" }
loam-asset     = { path = "crates/loam-asset",   version = "0.1.0" }
loam-input     = { path = "crates/loam-input",   version = "0.1.0" }
loam-camera    = { path = "crates/loam-camera",  version = "0.1.0" }
loam-player    = { path = "crates/loam-player",  version = "0.1.0" }
loam-physics   = { path = "crates/loam-physics", version = "0.1.0" }
loam-app       = { path = "crates/loam-app",     version = "0.1.0" }
loam-text      = { path = "crates/loam-text",    version = "0.1.0" }

[dev-dependencies]
# `tests/workspace_manifests.rs` reads every member manifest to gate
# publishability; parsing them beats scanning lines that a table-form dep
# declaration would slip past. `toml_edit` rather than `toml` because the
# build graph already resolves it, so the gate costs no new crates.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[features]
default = []
