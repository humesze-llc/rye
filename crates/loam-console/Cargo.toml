[package]
name = "loam-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Developer console model: command registry, scrollback, tokenizer, tab completion, key binds. No UI dependency."

[dependencies]
anyhow.workspace = true

# `web-sys` (with the `console` feature) backs the optional scrollback echo
# path (`log echo on`): `web_sys::console::log_1` mirrors lines to the browser
# DevTools console without routing through `tracing`, which would feed back
# into `loam_app::log`'s tracing -> scrollback mirror.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
